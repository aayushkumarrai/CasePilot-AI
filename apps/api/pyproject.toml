[project]
name = "casepilot-api"
version = "0.1.0"
description = "FastAPI backend for CasePilot AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires explicit credentials and an owned ready-document fixture in Supabase"
]

[tool.ruff]
line-length = 100
